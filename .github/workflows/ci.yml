name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q
      - name: Offline demo
        run: |
          python -m mcw run briefs/sunscreen-xhs.yaml --mock --run-id ci-sunscreen --out .mcw
          python -m mcw score --fixtures
          python -m mcw list-versions ci-sunscreen --out .mcw
          python -m mcw run briefs/sunscreen-xhs.yaml --mock --continue-run ci-sunscreen --out .mcw \
            --reviewer ci --comment "保留声明，删掉多余修饰"
          python -m mcw compare ci-sunscreen --left v1 --right v2 --out .mcw >/tmp/mcw-compare.md
          python -m mcw list-briefs | tee /tmp/mcw-list-briefs.txt
          python -m mcw list-briefs --json > /tmp/mcw-list-briefs.json
          python -m mcw list-runs --out .mcw | tee /tmp/mcw-list-runs.txt
          python -m mcw stats --out .mcw | tee /tmp/mcw-stats.txt
          python -m mcw failures --out .mcw | tee /tmp/mcw-failures.txt
          python -m mcw list-findings --out .mcw | tee /tmp/mcw-list-findings.txt
          python -m mcw list-findings --out .mcw --json > /tmp/mcw-list-findings.json
          python -m mcw list-drafts --out .mcw | tee /tmp/mcw-list-drafts.txt
          python -m mcw list-drafts --out .mcw --json > /tmp/mcw-list-drafts.json
          python -m mcw show --out .mcw | tee /tmp/mcw-show.txt
          python -m mcw show --out .mcw --json > /tmp/mcw-show.json
          python - <<'PY'
          import json
          from pathlib import Path

          from mcw.scoring.rubric import OFFLINE_SCORE_NOTE
          root = Path(".mcw/runs/ci-sunscreen")
          drafts = json.loads((root / "drafts.json").read_text(encoding="utf-8"))
          checklist = json.loads((root / "checklist.json").read_text(encoding="utf-8"))
          scores = json.loads((root / "scores.json").read_text(encoding="utf-8"))
          assert drafts["drafts"], "expected drafts"
          assert checklist["items"], "expected checklist"
          assert scores["not_business_conversion"] is True
          assert "离线内容分" in scores["note"]
          assert (root / "report.md").is_file()
          assert (root / "compare-v1-v2.md").is_file()
          listing = Path("/tmp/mcw-list-runs.txt").read_text(encoding="utf-8")
          assert "ci-sunscreen" in listing
          assert "离线内容分" in listing
          briefs = Path("/tmp/mcw-list-briefs.txt").read_text(encoding="utf-8")
          for brief_id in (
              "sunscreen-xhs",
              "coffee-wechat",
              "fitness-douyin",
              "creditcard-official",
              "kidsnack-ecommerce",
          ):
              assert brief_id in briefs
          for label in ("小红书", "微信公众号", "抖音", "官网", "电商详情"):
              assert label in briefs
          assert "briefs: 5" in briefs
          brief_payload = json.loads(Path("/tmp/mcw-list-briefs.json").read_text(encoding="utf-8"))
          assert brief_payload["brief_count"] == 5
          assert brief_payload["skipped"] == []
          assert {row["id"] for row in brief_payload["briefs"]} == {
              "sunscreen-xhs",
              "coffee-wechat",
              "fitness-douyin",
              "creditcard-official",
              "kidsnack-ecommerce",
          }
          stats = Path("/tmp/mcw-stats.txt").read_text(encoding="utf-8")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["run_id"] == "ci-sunscreen"
          assert manifest["brief_id"] in stats
          assert "小红书" in stats
          assert "runs:" in stats
          assert "versions:" in stats
          assert "离线内容分" in stats
          failures = Path("/tmp/mcw-failures.txt").read_text(encoding="utf-8")
          assert "没有未满分或被驳回的运行" in failures
          assert "ci-sunscreen" not in failures
          assert "离线内容分" in failures
          findings = Path("/tmp/mcw-list-findings.txt").read_text(encoding="utf-8")
          assert "没有发现" in findings
          assert "ci-sunscreen" not in findings
          assert "checklist.json" in findings
          assert "转化率" in findings
          findings_payload = json.loads(Path("/tmp/mcw-list-findings.json").read_text(encoding="utf-8"))
          assert findings_payload["findings"] == []
          assert findings_payload["n"] == 1
          assert findings_payload["n_with_findings"] == 0
          assert findings_payload["n_without_findings"] == 1
          assert findings_payload["n_listed"] == 0
          assert findings_payload["not_business_conversion"] is True
          assert "转化率" in findings_payload["note"]
          history = json.loads((root / "versions.json").read_text(encoding="utf-8"))
          assert history["versions"][-1]["version"] == "v2"
          stored_drafts = json.loads((root / "versions" / "v2" / "drafts.json").read_text(encoding="utf-8"))
          stored_scores = json.loads((root / "versions" / "v2" / "scores.json").read_text(encoding="utf-8"))
          assert len(stored_drafts["drafts"]) == 3
          draft_text = Path("/tmp/mcw-list-drafts.txt").read_text(encoding="utf-8")
          assert "ci-sunscreen" in draft_text
          assert "离线内容分" in draft_text
          assert "转化率" in draft_text
          best_id = stored_scores["best_draft_id"]
          best_lines = [line for line in draft_text.splitlines() if best_id in line]
          assert best_lines and "recommended" in best_lines[0]
          for stored in stored_drafts["drafts"]:
              assert stored["id"] in draft_text
              if stored["id"] != best_id:
                  other = next(line for line in draft_text.splitlines() if stored["id"] in line)
                  assert "recommended" not in other
          drafts_payload = json.loads(Path("/tmp/mcw-list-drafts.json").read_text(encoding="utf-8"))
          assert drafts_payload["not_business_conversion"] is True
          assert "转化率" in drafts_payload["note"]
          assert "离线内容分" in drafts_payload["note"]
          listed = drafts_payload["drafts"]
          assert drafts_payload["n_listed"] == len(listed) == 3
          assert [row["run_id"] for row in listed] == ["ci-sunscreen", "ci-sunscreen", "ci-sunscreen"]
          assert [row["version"] for row in listed] == ["v2", "v2", "v2"]
          assert [row["draft_id"] for row in listed] == [item["id"] for item in stored_drafts["drafts"]]
          assert sum(1 for row in listed if row["recommended"]) == 1
          assert next(row["draft_id"] for row in listed if row["recommended"]) == best_id
          stored_overall = {
              item["draft_id"]: item["score"]["overall"] for item in stored_scores["drafts"]
          }
          for row in listed:
              assert row["overall"] == stored_overall[row["draft_id"]]
          show_text = Path("/tmp/mcw-show.txt").read_text(encoding="utf-8")
          assert OFFLINE_SCORE_NOTE in show_text
          assert "离线内容分" in show_text
          assert "转化率" in show_text
          show_headers = [line for line in show_text.splitlines() if line.startswith("ci-sunscreen")]
          assert show_headers
          assert all("| v2 |" in line for line in show_headers)
          for stored in stored_drafts["drafts"]:
              assert stored["text"] in show_text
          show_best = [line for line in show_headers if best_id in line]
          assert show_best and "recommended" in show_best[0]
          for stored in stored_drafts["drafts"]:
              if stored["id"] != best_id:
                  other = next(line for line in show_headers if stored["id"] in line)
                  assert "recommended" not in other
          show_payload = json.loads(Path("/tmp/mcw-show.json").read_text(encoding="utf-8"))
          assert show_payload["not_business_conversion"] is True
          assert "转化率" in show_payload["note"]
          assert "离线内容分" in show_payload["note"]
          shown = show_payload["drafts"]
          assert show_payload["n_listed"] == len(shown) == 3
          assert [row["version"] for row in shown] == ["v2", "v2", "v2"]
          assert [row["text"] for row in shown] == [item["text"] for item in stored_drafts["drafts"]]
          assert sum(1 for row in shown if row["recommended"]) == 1
          print("ci demo ok", len(drafts["drafts"]))
          PY
